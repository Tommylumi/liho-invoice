<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>里好餐桌 門市進貨系統</title>
  <!-- App 圖示與全螢幕設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="里好進貨">
  <meta name="application-name" content="里好進貨">
  <meta name="theme-color" content="#9B443B">
  
  <link rel="apple-touch-icon" sizes="180x180" id="appleTouchIcon" href="icon.jpg?v=7">
  <link rel="icon" type="image/jpeg" sizes="192x192" id="androidFavicon" href="icon.jpg?v=7">
  <link rel="shortcut icon" href="icon.jpg?v=7">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            liho: {
              red: '#9B443B',
              redhover: '#823830',
              redlight: '#F8ECEB',
              green: '#4E7055',
              greenlight: '#EDF3EE',
              sand: '#E8DFD3',
              bg: '#FAF7F2',
              dark: '#2D2825',
              muted: '#7A726D'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['SF Mono', 'Menlo', 'Monaco', 'Courier New', 'monospace']
          },
          boxShadow: {
            'ticket': '0 8px 30px rgba(45, 40, 37, 0.08)',
            'nav': '0 -4px 20px rgba(0, 0, 0, 0.06)'
          }
        }
      }
    };
  </script>
  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      background-color: #FAF7F2;
    }
    @keyframes scanLine {
      0% { top: 5%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 5%; opacity: 0.8; }
    }
    .scanner-active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #4E7055, #9B443B, transparent);
      box-shadow: 0 0 12px #4E7055;
      animation: scanLine 2s infinite ease-in-out;
      z-index: 20;
    }
  </style>
</head>
<body class="text-liho-dark font-sans flex flex-col min-h-screen select-none antialiased">

  <!-- 頂部狀態列 -->
  <header class="bg-liho-red text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-10 h-10 rounded-xl bg-[#9B443B] flex items-center justify-center shadow-md overflow-hidden flex-shrink-0 border-2 border-white/30 relative">
          <img id="headerBrandLogo" src="icon.jpg" alt="里好" class="w-full h-full object-cover block relative z-10" onerror="this.style.opacity='0'; document.getElementById('headerFallbackText').style.display='flex';">
          <div id="headerFallbackText" class="absolute inset-0 flex items-center justify-center text-white font-black text-[13px] tracking-wider leading-none select-none bg-[#9B443B]">
            里好
          </div>
        </div>
        <div>
          <h1 class="text-base font-black tracking-tight leading-none">里好餐桌 • 進貨系統</h1>
          <div class="flex items-center space-x-1.5 mt-0.5">
            <span id="syncDot" class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="headerDateDisplay" class="text-[11px] text-white/80 font-medium">載入中...</span>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button id="btnQuickSync" class="flex items-center space-x-1 px-2.5 py-1 rounded-full bg-black/20 hover:bg-black/30 text-[11px] font-bold tracking-wide transition-colors">
          <span id="syncText">雲端就緒</span>
        </button>
      </div>
    </div>

    <!-- 當日進度線 -->
    <div class="bg-black/15 px-4 py-1.5 flex items-center justify-between text-[11px] text-white/90">
      <div class="flex items-center space-x-2">
        <span>今日進貨：<strong id="barCount" class="font-mono text-white text-xs">0 / 20</strong> 張</span>
        <span class="text-white/40">|</span>
        <span>總金額：<strong id="barTotal" class="font-mono text-white text-xs">NT$ 0</strong></span>
      </div>
      <div class="w-24 bg-white/25 rounded-full h-1.5 overflow-hidden">
        <div id="barFill" class="bg-emerald-400 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <!-- 主視窗容器 -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 pb-28">

    <!-- ==================== TAB 1: 拍照與記帳主介面 ==================== -->
    <section id="tabViewScan" class="space-y-4">

      <!-- 拍照入口 -->
      <div id="sectionCaptureEntry" class="bg-white rounded-3xl p-6 border-2 border-dashed border-liho-sand text-center shadow-sm relative overflow-hidden">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
        <input type="file" id="galleryInput" accept="image/*" class="hidden">

        <div class="w-16 h-16 mx-auto rounded-2xl bg-liho-redlight flex items-center justify-center text-liho-red mb-3">
          <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>

        <h2 class="text-lg font-black text-liho-dark mb-1">進貨單拍照自動對帳</h2>
        <p class="text-xs text-liho-muted mb-5">AI 自動辨識單據，直傳 Google 試算表（絕不重複累加）</p>

        <div class="grid grid-cols-1 gap-2.5">
          <button type="button" id="btnLaunchCamera" class="w-full py-4 rounded-2xl bg-liho-red hover:bg-liho-redhover text-white font-black text-base flex items-center justify-center space-x-2 shadow-lg shadow-liho-red/20 active:scale-[0.98] transition-all">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span>開啟手機相機拍照</span>
          </button>
          
          <button type="button" id="btnLaunchGallery" class="w-full py-2.5 rounded-xl bg-liho-sand/40 hover:bg-liho-sand text-liho-dark font-bold text-xs flex items-center justify-center space-x-1.5 transition-colors">
            <svg class="w-4 h-4 text-liho-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span>從相簿選擇單據</span>
          </button>
        </div>
      </div>

      <!-- 預覽與掃描中動畫 -->
      <div id="sectionPreviewBox" class="hidden bg-white rounded-2xl p-3 shadow-sm border border-liho-sand relative overflow-hidden">
        <div class="relative rounded-xl overflow-hidden bg-stone-900 aspect-[4/3] flex items-center justify-center" id="scannerWrapper">
          <img id="imgPreview" class="max-w-full max-h-full object-contain" alt="單據預覽">
          
          <div id="scannerOverlay" class="hidden absolute inset-0 bg-stone-900/60 backdrop-blur-[2px] flex flex-col items-center justify-center text-white z-30 p-4 text-center">
            <div class="w-12 h-12 border-3 border-emerald-400 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p class="font-black text-sm tracking-wide">Gemini 正在精準辨識單據...</p>
            <p class="text-[11px] text-white/70 mt-0.5">自動抓取金額、單號與廠商</p>
          </div>
        </div>

        <div class="flex items-center justify-between mt-2 pt-2 border-t border-stone-100 text-xs font-semibold">
          <button type="button" id="btnRotatePhoto" class="px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 flex items-center space-x-1">
            <span>🔄 旋轉 90°</span>
          </button>
          <button type="button" id="btnRetakePhoto" class="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 flex items-center space-x-1">
            <span>🗑️ 重新拍攝</span>
          </button>
        </div>
      </div>

      <!-- 核對卡片 -->
      <div id="sectionFormTicket" class="bg-white rounded-3xl shadow-ticket border border-stone-200 overflow-hidden">
        
        <div class="bg-gradient-to-r from-stone-800 to-stone-900 text-white px-5 py-3 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span class="text-xs font-black tracking-wider uppercase">進貨單核對卡</span>
          </div>
          <span id="targetMonthChip" class="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-white/20 text-white">202609</span>
        </div>

        <div class="p-5 space-y-4">
          
          <!-- 金額 -->
          <div class="bg-liho-sand/20 rounded-2xl p-3.5 border border-liho-sand/60 text-center">
            <label class="block text-[11px] font-bold text-liho-muted uppercase tracking-wider mb-1">
              💰 進貨總金額 (含稅)
            </label>
            <div class="relative flex items-center justify-center">
              <span class="text-xl font-bold text-liho-red font-mono mr-1">NT$</span>
              <input type="number" id="inputTotalAmount" class="w-48 text-center text-3xl font-black font-mono text-liho-red bg-transparent focus:outline-none border-b-2 border-liho-red/40 focus:border-liho-red py-0.5" placeholder="0">
            </div>
            <p class="text-[10px] text-liho-muted mt-1">※ 點擊金額可手動修正</p>
          </div>

          <!-- 單號/發票（第一層必備防重複欄位） -->
          <div class="bg-amber-50/60 rounded-2xl p-3 border border-amber-200/80">
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-black text-amber-900 flex items-center space-x-1">
                <span>🧾 單據 / 發票號碼</span>
                <span class="text-[10px] px-1.5 py-0.2 rounded bg-amber-200 text-amber-900 font-bold">防重複機制</span>
              </label>
              <span class="text-[10px] text-amber-700">自動抓取或手動輸入</span>
            </div>
            <input type="text" id="inputInvoiceNo" class="w-full px-3.5 py-2 rounded-xl border border-amber-300 focus:border-liho-red focus:ring-1 focus:ring-liho-red text-sm font-mono font-bold text-liho-dark bg-white" placeholder="例如：SA1150911090">
          </div>

          <!-- 廠商 -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-bold text-liho-dark">🏢 廠商名稱</label>
              <span class="text-[10px] text-liho-muted">點選下方或手動輸入新廠商</span>
            </div>
            <input type="text" id="inputVendor" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-liho-red focus:ring-1 focus:ring-liho-red text-sm font-bold text-liho-dark" placeholder="請輸入或點選廠商...">
            
            <div class="mt-2">
              <div class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto pr-1" id="vendorTagContainer">
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">德麥</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">憶霖</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">富盈</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">第一饗</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">鴻品</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">凱燁</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">樹森</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">有心</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">Agogo</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">美金</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">三佳</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">恬芯</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">鼎鎂</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">源品</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">潞運</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">麻辣</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">好市多</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">開元</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">檸檬先生</button>
                <button type="button" class="btn-vendor-tag px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-liho-redlight hover:text-liho-red text-stone-700 text-xs font-bold transition-colors">親民</button>
              </div>
            </div>
          </div>

          <!-- 付款方式 -->
          <div>
            <label class="block text-xs font-bold text-liho-dark mb-1.5">💳 付款方式</label>
            <div class="grid grid-cols-3 gap-2" id="paymentButtonGroup">
              <button type="button" data-val="下貨收現" class="btn-payment-pill py-2.5 px-2 rounded-xl text-xs font-black border-2 border-liho-red bg-liho-red text-white shadow-sm flex flex-col items-center justify-center transition-all">
                <span>💵 下貨收現</span>
              </button>
              <button type="button" data-val="廠商月結" class="btn-payment-pill py-2.5 px-2 rounded-xl text-xs font-bold border-2 border-stone-200 bg-stone-50 text-stone-600 hover:bg-stone-100 flex flex-col items-center justify-center transition-all">
                <span>📅 廠商月結</span>
              </button>
              <button type="button" data-val="已匯款" class="btn-payment-pill py-2.5 px-2 rounded-xl text-xs font-bold border-2 border-stone-200 bg-stone-50 text-stone-600 hover:bg-stone-100 flex flex-col items-center justify-center transition-all">
                <span>🏦 已匯款</span>
              </button>
            </div>
            <input type="hidden" id="inputPaymentMethod" value="下貨收現">
          </div>

          <!-- 日期 & 經手人 -->
          <div class="space-y-3 pt-1">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-liho-dark mb-1">📅 進貨日期</label>
                <input type="date" id="inputDate" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs font-semibold text-liho-dark focus:border-liho-red">
              </div>
              <div>
                <label class="block text-xs font-bold text-liho-dark mb-1">👤 經手同仁</label>
                <input type="text" id="inputStaff" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs font-bold text-liho-dark focus:border-liho-red bg-stone-50" placeholder="點擊下方快速選取">
              </div>
            </div>

            <div class="grid grid-cols-5 gap-1.5" id="staffButtonGroup">
              <button type="button" data-staff="惠毓" class="btn-staff-pill py-2 px-1 rounded-xl text-xs font-black border border-stone-200 bg-stone-50 text-stone-700 hover:bg-stone-100 text-center transition-all">惠毓</button>
              <button type="button" data-staff="梓庭" class="btn-staff-pill py-2 px-1 rounded-xl text-xs font-black border border-stone-200 bg-stone-50 text-stone-700 hover:bg-stone-100 text-center transition-all">梓庭</button>
              <button type="button" data-staff="佩嘉" class="btn-staff-pill py-2 px-1 rounded-xl text-xs font-black border border-stone-200 bg-stone-50 text-stone-700 hover:bg-stone-100 text-center transition-all">佩嘉</button>
              <button type="button" data-staff="雨函" class="btn-staff-pill py-2 px-1 rounded-xl text-xs font-black border border-stone-200 bg-stone-50 text-stone-700 hover:bg-stone-100 text-center transition-all">雨函</button>
              <button type="button" data-staff="其他" class="btn-staff-pill py-2 px-1 rounded-xl text-xs font-black border border-stone-200 bg-stone-50 text-stone-700 hover:bg-stone-100 text-center transition-all">其他</button>
            </div>
          </div>

          <!-- 送出按鈕 -->
          <div class="pt-2">
            <button type="button" id="btnSubmitTicket" class="w-full py-4 rounded-2xl bg-liho-green hover:bg-emerald-800 text-white font-black text-base flex items-center justify-center space-x-2 shadow-lg shadow-liho-green/20 active:scale-[0.98] transition-all">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
              <span>確認無誤 • 直傳 Google 試算表</span>
            </button>
            <p class="text-[10px] text-center text-liho-muted mt-2">重複單號自動覆蓋，金額絕不重複計算</p>
          </div>

        </div>
      </div>
    </section>

    <!-- ==================== TAB 2: 今日已傳紀錄 ==================== -->
    <section id="tabViewHistory" class="hidden space-y-3">
      <div class="flex items-center justify-between pb-1">
        <div>
          <h2 class="text-base font-black text-liho-dark">今日進貨單據</h2>
          <p class="text-[11px] text-liho-muted">若多拍或記錯，可直接點「刪除」</p>
        </div>
        <button type="button" id="btnRefreshHistory" class="px-2.5 py-1 rounded-lg bg-white border border-stone-200 text-xs font-bold text-liho-dark shadow-sm hover:bg-stone-50 flex items-center space-x-1">
          <span>🔄 重整雲端</span>
        </button>
      </div>

      <div id="receiptCardList" class="space-y-2.5"></div>

      <div id="emptyHistoryState" class="hidden bg-white rounded-2xl p-8 text-center border border-stone-200 shadow-sm">
        <div class="text-3xl mb-2">🧾</div>
        <p class="text-sm font-bold text-liho-dark">今日尚未有進貨紀錄</p>
        <p class="text-xs text-liho-muted mt-1">點擊下方「拍照記帳」開始記錄</p>
      </div>
    </section>

    <!-- ==================== TAB 3: 設定 ==================== -->
    <section id="tabViewSettings" class="hidden space-y-4">
      <div class="bg-white rounded-3xl p-5 border border-stone-200 shadow-sm space-y-4">
        <div>
          <h2 class="text-base font-black text-liho-dark">門市連線設定</h2>
          <p class="text-xs text-liho-muted">可透過網址參數自動綁定，免手動設定</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-liho-dark mb-1">Google Apps Script 部署網址</label>

  <!-- 大圖檢視 Modal -->
  <div id="modalPhotoView" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-4">
    <button type="button" id="btnClosePhotoModal" class="absolute top-4 right-4 text-white text-2xl p-2 font-bold">✕</button>
    <img id="fullPhotoViewImg" class="max-w-full max-h-[85vh] object-contain rounded-xl" alt="單據大圖">
  </div>

  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-full text-xs font-black shadow-xl transition-all duration-300 text-center max-w-xs"></div>

  <script>
    const DEFAULT_SHEET_URL = "https://script.google.com/macros/s/AKfycbzdlLHGpB5gdXgitXSM6pifJR07WCFqYMIoKOrJQ81XjZpePvMAGCRgsrm1m_3YDlWl/exec";
    
    // 金鑰預設留空，完全透過網址參數 ?apiKey=... 動態帶入，安全無虞不觸發 GitHub 警告
    const DEFAULT_API_KEY = "";

    const STATE = {
      sheetUrl: localStorage.getItem("LIHO_SHEET_URL") || DEFAULT_SHEET_URL,
      apiKey: localStorage.getItem("LIHO_API_KEY") || DEFAULT_API_KEY,
      defaultStaff: localStorage.getItem("LIHO_DEFAULT_STAFF") || "惠毓",
      todayRecords: [],
      currentImageData: null,
      currentRotation: 0,
      isProcessing: false
    };

    let DOM = {};

    window.addEventListener("DOMContentLoaded", () => {
      DOM = {
        headerDateDisplay: document.getElementById("headerDateDisplay"),
        barCount: document.getElementById("barCount"),
        barTotal: document.getElementById("barTotal"),
        barFill: document.getElementById("barFill"),
        btnQuickSync: document.getElementById("btnQuickSync"),
        syncDot: document.getElementById("syncDot"),
        syncText: document.getElementById("syncText"),

        tabBtnScan: document.getElementById("tabBtnScan"),
        tabBtnHistory: document.getElementById("tabBtnHistory"),
        tabBtnSettings: document.getElementById("tabBtnSettings"),
        tabViewScan: document.getElementById("tabViewScan"),
        tabViewHistory: document.getElementById("tabViewHistory"),
        tabViewSettings: document.getElementById("tabViewSettings"),
        tabHistoryBadge: document.getElementById("tabHistoryBadge"),

        cameraInput: document.getElementById("cameraInput"),
        galleryInput: document.getElementById("galleryInput"),
        btnLaunchCamera: document.getElementById("btnLaunchCamera"),
        btnLaunchGallery: document.getElementById("btnLaunchGallery"),
        sectionCaptureEntry: document.getElementById("sectionCaptureEntry"),
        sectionPreviewBox: document.getElementById("sectionPreviewBox"),
        imgPreview: document.getElementById("imgPreview"),
        scannerOverlay: document.getElementById("scannerOverlay"),
        btnRotatePhoto: document.getElementById("btnRotatePhoto"),
        btnRetakePhoto: document.getElementById("btnRetakePhoto"),

        targetMonthChip: document.getElementById("targetMonthChip"),
        inputTotalAmount: document.getElementById("inputTotalAmount"),
        inputInvoiceNo: document.getElementById("inputInvoiceNo"),
        inputVendor: document.getElementById("inputVendor"),
        inputDate: document.getElementById("inputDate"),
        inputStaff: document.getElementById("inputStaff"),
        inputPaymentMethod: document.getElementById("inputPaymentMethod"),
        btnSubmitTicket: document.getElementById("btnSubmitTicket"),

        receiptCardList: document.getElementById("receiptCardList"),
        emptyHistoryState: document.getElementById("emptyHistoryState"),
        modalPhotoView: document.getElementById("modalPhotoView"),
        fullPhotoViewImg: document.getElementById("fullPhotoViewImg"),
        btnClosePhotoModal: document.getElementById("btnClosePhotoModal"),
        toast: document.getElementById("toast"),

        settingSheetUrl: document.getElementById("settingSheetUrl"),
        settingDefaultStaff: document.getElementById("settingDefaultStaff"),
        settingApiKey: document.getElementById("settingApiKey"),
        btnSaveSettings: document.getElementById("btnSaveSettings"),
        btnClearLocalCache: document.getElementById("btnClearLocalCache"),
        btnRefreshHistory: document.getElementById("btnRefreshHistory")
      };

      initApp();
    });

    function initApp() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const pUrl = urlParams.get("sheetUrl");
        const pKey = urlParams.get("apiKey");
        if (pUrl) {
          STATE.sheetUrl = decodeURIComponent(pUrl);
          localStorage.setItem("LIHO_SHEET_URL", STATE.sheetUrl);
        }
        if (pKey) {
          STATE.apiKey = decodeURIComponent(pKey);
          localStorage.setItem("LIHO_API_KEY", STATE.apiKey);
        }
      } catch (e) {}

      setupBrandIcon();

      const now = new Date();
      const dateStr = now.toISOString().split("T")[0];
      if (DOM.inputDate) DOM.inputDate.value = dateStr;
      
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      DOM.headerDateDisplay.textContent = `${now.getMonth() + 1}月${now.getDate()}日 (週${weekdays[now.getDay()]})`;
      updateMonthBadge(dateStr);

      DOM.settingSheetUrl.value = STATE.sheetUrl;
      DOM.settingApiKey.value = STATE.apiKey;
      DOM.settingDefaultStaff.value = STATE.defaultStaff;
      DOM.inputStaff.value = STATE.defaultStaff;
      highlightStaffBtn(STATE.defaultStaff);

      loadLocalRecords();
      updateDashboard();
      bindEvents();
      fetchTodayRecords();
    }

    function updateMonthBadge(dateStr) {
      if (!dateStr) return;
      DOM.targetMonthChip.textContent = dateStr.replace(/[^0-9]/g, "").substring(0, 6);
    }

    function highlightStaffBtn(name) {
      document.querySelectorAll(".btn-staff-pill").forEach(btn => {
        if (btn.getAttribute("data-staff") === name) {
          btn.classList.add("border-liho-red", "bg-liho-redlight", "text-liho-red", "font-black");
          btn.classList.remove("border-stone-200", "bg-stone-50", "text-stone-700");
        } else {
          btn.classList.remove("border-liho-red", "bg-liho-redlight", "text-liho-red", "font-black");
          btn.classList.add("border-stone-200", "bg-stone-50", "text-stone-700");
        }
      });
    }

    function bindEvents() {
      DOM.tabBtnScan?.addEventListener("click", () => switchTab("scan"));
      DOM.tabBtnHistory?.addEventListener("click", () => switchTab("history"));
      DOM.tabBtnSettings?.addEventListener("click", () => switchTab("settings"));

      DOM.btnLaunchCamera?.addEventListener("click", () => DOM.cameraInput?.click());
      DOM.btnLaunchGallery?.addEventListener("click", () => DOM.galleryInput?.click());
      DOM.cameraInput?.addEventListener("change", handleFileSelect);
      DOM.galleryInput?.addEventListener("change", handleFileSelect);

      DOM.btnRotatePhoto?.addEventListener("click", rotatePhoto);
      DOM.btnRetakePhoto?.addEventListener("click", resetCapture);

      document.querySelectorAll(".btn-payment-pill").forEach(btn => {
        btn.addEventListener("click", () => {
          DOM.inputPaymentMethod.value = btn.getAttribute("data-val");
          document.querySelectorAll(".btn-payment-pill").forEach(b => {
            b.classList.remove("border-liho-red", "bg-liho-red", "text-white");
            b.classList.add("border-stone-200", "bg-stone-50", "text-stone-600");
          });
          btn.classList.add("border-liho-red", "bg-liho-red", "text-white");
          btn.classList.remove("border-stone-200", "bg-stone-50", "text-stone-600");
        });
      });

      document.querySelectorAll(".btn-vendor-tag").forEach(tag => {
        tag.addEventListener("click", () => {
          DOM.inputVendor.value = tag.textContent.trim();
          DOM.inputVendor.focus();
        });
      });

      document.querySelectorAll(".btn-staff-pill").forEach(btn => {
        btn.addEventListener("click", () => {
          const s = btn.getAttribute("data-staff");
          if (s === "其他") {
            DOM.inputStaff.readOnly = false;
            DOM.inputStaff.value = "";
            DOM.inputStaff.placeholder = "請輸入姓名...";
            DOM.inputStaff.focus();
          } else {
            DOM.inputStaff.readOnly = true;
            DOM.inputStaff.value = s;
          }
          highlightStaffBtn(s);
        });
      });

      DOM.inputDate?.addEventListener("change", (e) => updateMonthBadge(e.target.value));
      DOM.btnSubmitTicket?.addEventListener("click", handleTicketSubmit);

      DOM.btnSaveSettings?.addEventListener("click", saveSettings);
      DOM.btnClearLocalCache?.addEventListener("click", () => {
        STATE.todayRecords = [];
        saveLocalRecords();
        updateDashboard();
        renderHistoryList();
        showToast("已清空本地快取！", "success");
        fetchTodayRecords();
      });

      DOM.btnRefreshHistory?.addEventListener("click", fetchTodayRecords);
      DOM.btnQuickSync?.addEventListener("click", fetchTodayRecords);
      DOM.btnClosePhotoModal?.addEventListener("click", () => DOM.modalPhotoView?.classList.add("hidden"));
    }

    function switchTab(tabId) {
      DOM.tabViewScan?.classList.add("hidden");
      DOM.tabViewHistory?.classList.add("hidden");
      DOM.tabViewSettings?.classList.add("hidden");

      [DOM.tabBtnScan, DOM.tabBtnHistory, DOM.tabBtnSettings].forEach(btn => {
        btn?.classList.remove("text-liho-red", "font-black");
        btn?.classList.add("text-stone-400", "font-medium");
      });

      if (tabId === "scan") {
        DOM.tabViewScan?.classList.remove("hidden");
        DOM.tabBtnScan?.classList.add("text-liho-red", "font-black");
      } else if (tabId === "history") {
        DOM.tabViewHistory?.classList.remove("hidden");
        DOM.tabBtnHistory?.classList.add("text-liho-red", "font-black");
        renderHistoryList();
      } else if (tabId === "settings") {
        DOM.tabViewSettings?.classList.remove("hidden");
        DOM.tabBtnSettings?.classList.add("text-liho-red", "font-black");
      }
    }

    function handleFileSelect(e) {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        STATE.currentImageData = evt.target.result;
        STATE.currentRotation = 0;
        
        DOM.imgPreview.src = STATE.currentImageData;
        DOM.imgPreview.style.transform = `rotate(0deg)`;
        DOM.sectionPreviewBox?.classList.remove("hidden");
        DOM.sectionCaptureEntry?.classList.add("hidden");

        performGeminiOcr(STATE.currentImageData);
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    function rotatePhoto() {
      if (!STATE.currentImageData) return;
      STATE.currentRotation = (STATE.currentRotation + 90) % 360;
      DOM.imgPreview.style.transform = `rotate(${STATE.currentRotation}deg)`;
    }

    function resetCapture() {
      STATE.currentImageData = null;
      STATE.currentRotation = 0;
      DOM.sectionPreviewBox?.classList.add("hidden");
      DOM.sectionCaptureEntry?.classList.remove("hidden");
      DOM.inputTotalAmount.value = "";
      DOM.inputInvoiceNo.value = "";
      DOM.inputVendor.value = "";
    }

    async function performGeminiOcr(base64Data) {
      DOM.scannerOverlay?.classList.remove("hidden");

      const systemPrompt = `你是一位專業的餐飲業「里好餐桌」店長助理，請仔細辨識這張進貨單據，直接回傳乾淨的 JSON：
{
  "vendor": "廠商名稱 (從 德麥, 憶霖, 富盈, 第一饗, 鴻品, 凱燁, 樹森, 有心, Agogo, 美金, 三佳, 恬芯, 鼎鎂, 源品, 潞運, 麻辣, 好市多, 開元, 檸檬先生, 親民 等優先匹配)",
  "totalAmount": 2520,
  "date": "YYYY-MM-DD",
  "invoiceNo": "單據編號或發票號碼",
  "paymentMethod": "下貨收現 或 廠商月結 或 已匯款"
}`;

      try {
        const cleanBase64 = base64Data.split(",")[1] || base64Data;
        const apiKey = (STATE.apiKey || "").trim();

        if (!apiKey) {
          showToast("請在設定頁面輸入 Gemini API Key", "warning");
          DOM.scannerOverlay?.classList.add("hidden");
          return;
        }

        const models = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"];
        let parsed = null;

        const payload = {
          systemInstruction: { parts: [{ text: systemPrompt }] },
          contents: [{
            parts: [
              { text: "請辨識這張進貨出貨單據並回傳乾淨的 JSON 格式。" },
              { inlineData: { mimeType: "image/jpeg", data: cleanBase64 } }
            ]
          }],
          generationConfig: { responseMimeType: "application/json" }
        };

        for (const model of models) {
          try {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const res = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (!res.ok) continue;

            const data = await res.json();
            const rawJson = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (rawJson) {
              parsed = JSON.parse(rawJson);
              break;
            }
          } catch (modelErr) {}
        }

        if (parsed) {
          if (parsed.totalAmount) DOM.inputTotalAmount.value = parsed.totalAmount;
          if (parsed.vendor) DOM.inputVendor.value = parsed.vendor;
          if (parsed.invoiceNo) DOM.inputInvoiceNo.value = parsed.invoiceNo;
          if (parsed.date) {
            let d = parsed.date.replace(/\./g, "-");
            const dParts = d.split("-");
            if (dParts[0] && parseInt(dParts[0], 10) < 1900) {
              d = (parseInt(dParts[0], 10) + 1911) + "-" + dParts.slice(1).join("-");
            }
            DOM.inputDate.value = d;
            updateMonthBadge(d);
          }
          if (parsed.paymentMethod) {
            const btn = document.querySelector(`.btn-payment-pill[data-val="${parsed.paymentMethod}"]`);
            if (btn) btn.click();
          }
          showToast("✨ AI 已成功辨識單據！", "success");
        } else {
          showToast("請手動核對金額與廠商", "warning");
        }
      } catch (err) {
        showToast("請手動核對金額與廠商", "warning");
      } finally {
        DOM.scannerOverlay?.classList.add("hidden");
      }
    }

    async function handleTicketSubmit() {
      if (STATE.isProcessing) return;

      const totalAmount = Number(DOM.inputTotalAmount.value) || 0;
      const vendor = DOM.inputVendor.value.trim();
      const date = DOM.inputDate.value || new Date().toISOString().split("T")[0];
      const invoiceNo = DOM.inputInvoiceNo.value.trim();

      if (!vendor) {
        showToast("請填寫廠商名稱！", "warning");
        DOM.inputVendor.focus();
        return;
      }
      if (totalAmount <= 0) {
        showToast("請輸入正確金額！", "warning");
        DOM.inputTotalAmount.focus();
        return;
      }

      const newRecord = {
        id: "REC-" + Date.now(),
        timestamp: new Date().toLocaleTimeString("zh-TW", { hour12: false }),
        date: date,
        vendor: vendor,
        invoiceNo: invoiceNo,
        totalAmount: totalAmount,
        paymentMethod: DOM.inputPaymentMethod.value,
        staff: DOM.inputStaff.value.trim() || STATE.defaultStaff,
        imagePreview: STATE.currentImageData || ""
      };

      STATE.isProcessing = true;
      DOM.btnSubmitTicket.disabled = true;
      DOM.btnSubmitTicket.innerHTML = `<span class="inline-block animate-spin mr-2">⏳</span> 正在寫入試算表（自動防覆蓋）...`;

      try {
        let compressedBase64 = "";
        if (STATE.currentImageData) {
          compressedBase64 = await compressImage(STATE.currentImageData, 1000, 0.7);
        }

        const payload = {
          ...newRecord,
          mode: "overwrite",
          imageBase64: compressedBase64,
          imageMime: "image/jpeg"
        };

        const res = await fetch(STATE.sheetUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const resultJson = await res.json().catch(() => ({}));

        if (resultJson.status === "duplicate_blocked") {
          showToast("⚠️ " + resultJson.message, "warning");
          STATE.isProcessing = false;
          DOM.btnSubmitTicket.disabled = false;
          DOM.btnSubmitTicket.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg><span>確認無誤 • 直傳 Google 試算表</span>`;
          return;
        }

        const cleanInv = invoiceNo.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
        STATE.todayRecords = STATE.todayRecords.filter(item => {
          const existInv = (item.invoiceNo || "").replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
          if (cleanInv && existInv && cleanInv === existInv) return false;
          if (item.vendor === vendor && item.date === date) return false;
          return true;
        });

        STATE.todayRecords.unshift(newRecord);
        saveLocalRecords();
        updateDashboard();

        showToast("🎉 成功入帳！（重複單號自動覆蓋）", "success");
        resetCapture();
        switchTab("history");

      } catch (e) {
        // 離線降級保護
        const cleanInv = invoiceNo.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
        STATE.todayRecords = STATE.todayRecords.filter(item => {
          const existInv = (item.invoiceNo || "").replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
          if (cleanInv && existInv && cleanInv === existInv) return false;
          return true;
        });
        STATE.todayRecords.unshift(newRecord);
        saveLocalRecords();
        updateDashboard();

        showToast("✓ 資料已送出，已更新本地紀錄！", "success");
        resetCapture();
        switchTab("history");
      } finally {
        STATE.isProcessing = false;
        DOM.btnSubmitTicket.disabled = false;
        DOM.btnSubmitTicket.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg><span>確認無誤 • 直傳 Google 試算表</span>`;
      }
    }

    function deleteRecord(index) {
      if (!confirm("確定要刪除這筆單據紀錄嗎？")) return;
      STATE.todayRecords.splice(index, 1);
      saveLocalRecords();
      updateDashboard();
      renderHistoryList();
      showToast("已刪除該筆單據！", "info");
    }

    function renderHistoryList() {
      if (!DOM.receiptCardList) return;
      DOM.receiptCardList.innerHTML = "";

      if (STATE.todayRecords.length === 0) {
        DOM.emptyHistoryState?.classList.remove("hidden");
        return;
      }
      DOM.emptyHistoryState?.classList.add("hidden");

      STATE.todayRecords.forEach((rec, idx) => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl p-3.5 border border-stone-200 shadow-sm flex items-center justify-between";

        const paymentColor = rec.paymentMethod === "下貨收現" ? "text-liho-red bg-liho-redlight" : "text-stone-600 bg-stone-100";
        let thumb = rec.imagePreview
          ? `<img src="${rec.imagePreview}" class="w-12 h-12 object-cover rounded-xl border border-stone-200 cursor-pointer btn-view-photo" data-img="${rec.imagePreview}">`
          : `<div class="w-12 h-12 rounded-xl bg-stone-100 flex items-center justify-center text-xs text-stone-400">無圖</div>`;

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            ${thumb}
            <div>
              <div class="flex items-center space-x-1.5">
                <span class="font-black text-sm text-liho-dark">${rec.vendor}</span>
                <span class="px-1.5 py-0.2 rounded text-[10px] font-bold ${paymentColor}">${rec.paymentMethod}</span>
              </div>
              <p class="text-[11px] text-liho-muted mt-0.5">
                ${rec.timestamp || ''} • 經手：${rec.staff || '同仁'}
              </p>
              ${rec.invoiceNo ? `<span class="text-[10px] font-mono text-stone-400">單號:${rec.invoiceNo}</span>` : ''}
            </div>
          </div>
          <div class="text-right flex flex-col items-end space-y-1">
            <div class="font-mono font-black text-base text-liho-red">NT$ ${(rec.totalAmount || 0).toLocaleString()}</div>
            <button type="button" class="btn-delete-rec text-[11px] text-rose-500 hover:text-rose-700 font-bold px-1.5 py-0.5 rounded bg-rose-50 hover:bg-rose-100 transition-colors" data-idx="${idx}">
              🗑️ 刪除
            </button>
          </div>
        `;

        const imgEl = card.querySelector(".btn-view-photo");
        if (imgEl) {
          imgEl.addEventListener("click", () => {
            DOM.fullPhotoViewImg.src = imgEl.getAttribute("data-img");
            DOM.modalPhotoView?.classList.remove("hidden");
            DOM.modalPhotoView?.classList.add("flex");
          });
        }

        const delBtn = card.querySelector(".btn-delete-rec");
        if (delBtn) {
          delBtn.addEventListener("click", () => deleteRecord(idx));
        }

        DOM.receiptCardList.appendChild(card);
      });
    }

    async function fetchTodayRecords() {
      if (!STATE.sheetUrl) return;
      DOM.syncDot.className = "w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping";
      DOM.syncText.textContent = "同步中...";

      try {
        const res = await fetch(STATE.sheetUrl, { method: "GET" });
        const json = await res.json();
        if (json && json.status === "success" && Array.isArray(json.records)) {
          STATE.todayRecords = json.records;
          updateDashboard();
          renderHistoryList();
          DOM.syncDot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400";
          DOM.syncText.textContent = "雲端即時";
          return;
        }
      } catch (e) {}

      DOM.syncDot.className = "w-1.5 h-1.5 rounded-full bg-stone-400";
      DOM.syncText.textContent = "離線模式";
    }

    function updateDashboard() {
      const count = STATE.todayRecords.length;
      const total = STATE.todayRecords.reduce((sum, r) => sum + (Number(r.totalAmount) || 0), 0);

      DOM.barCount.textContent = `${count} / 20`;
      DOM.barTotal.textContent = `NT$ ${total.toLocaleString()}`;
      DOM.barFill.style.width = `${Math.min(Math.round((count / 20) * 100), 100)}%`;

      if (DOM.tabHistoryBadge) {
        DOM.tabHistoryBadge.textContent = count;
        DOM.tabHistoryBadge.classList.toggle("hidden", count === 0);
      }
    }

    function saveLocalRecords() {
      localStorage.setItem("LIHO_RECORDS_" + (DOM.inputDate?.value || "TODAY"), JSON.stringify(STATE.todayRecords));
    }

    function loadLocalRecords() {
      const saved = localStorage.getItem("LIHO_RECORDS_" + (DOM.inputDate?.value || "TODAY"));
      if (saved) {
        try { STATE.todayRecords = JSON.parse(saved); } catch (e) {}
      }
    }

    function saveSettings() {
      STATE.sheetUrl = DOM.settingSheetUrl.value.trim();
      STATE.apiKey = DOM.settingApiKey.value.trim();
      STATE.defaultStaff = DOM.settingDefaultStaff.value.trim();

      localStorage.setItem("LIHO_SHEET_URL", STATE.sheetUrl);
      localStorage.setItem("LIHO_API_KEY", STATE.apiKey);
      localStorage.setItem("LIHO_DEFAULT_STAFF", STATE.defaultStaff);

      showToast("門市設定已儲存！", "success");
      switchTab("scan");
    }

    function compressImage(base64Str, maxWidth = 1000, quality = 0.7) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxWidth || h > maxWidth) {
            if (w > h) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
            else { w = Math.round((w * maxWidth) / h); h = maxWidth; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => resolve(base64Str);
        img.src = base64Str;
      });
    }

    function setupBrandIcon() {
      const appleIcon = document.getElementById("appleTouchIcon");
      const androidIcon = document.getElementById("androidFavicon");
      const headerLogo = document.getElementById("headerBrandLogo");

      const testImg = new Image();
      testImg.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = 180; canvas.height = 180;
        canvas.getContext("2d").drawImage(testImg, 0, 0, 180, 180);
        const png = canvas.toDataURL("image/png");
        if (appleIcon) appleIcon.href = png;
        if (androidIcon) androidIcon.href = png;
      };
      testImg.onerror = () => {
        const canvas = document.createElement("canvas");
        canvas.width = 192; canvas.height = 192;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#9B443B"; ctx.fillRect(0, 0, 192, 192);
        ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 78px sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("里好", 96, 96);
        const dataUrl = canvas.toDataURL("image/png");
        if (appleIcon) appleIcon.href = dataUrl;
        if (androidIcon) androidIcon.href = dataUrl;
        if (headerLogo) headerLogo.src = dataUrl;
      };
      testImg.src = "icon.jpg";
    }

    function showToast(msg, type = "info") {
      if (!DOM.toast) return;
      DOM.toast.textContent = msg;
      DOM.toast.className = `fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full text-xs font-black shadow-xl transition-all duration-300 text-center max-w-xs ${
        type === "success" ? "bg-emerald-600 text-white" : type === "warning" ? "bg-amber-500 text-white" : "bg-stone-800 text-white"
      }`;
      DOM.toast.classList.remove("hidden");
      setTimeout(() => DOM.toast?.classList.add("hidden"), 3000);
    }
  </script>
</body>
